<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aansh POS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
<title>Aansh Creations POS</title>
<style>
  :root {
    --bg: #f7f3ea;
    --card: #ffffff;
    --ink: #1f2a1f;
    --muted: #6b6f63;
    --line: #e4dccb;
    --green: #2f6b3a;
    --green-soft: #e3efe2;
    --amber: #c9761b;
    --amber-soft: #fbecd7;
    --red: #b3372b;
    --red-soft: #f8e1de;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: var(--green); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 0 10px;
  }
  header.top .wrap { display: flex; align-items: center; gap: 10px; }
  header.top h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .2px; }
  header.top h1 small { display: block; font-size: 12px; font-weight: 500; opacity: .85; }
  .sync-pill {
    font-size: 12px; padding: 4px 10px; border-radius: 99px;
    background: rgba(255,255,255,.18); color: #fff; white-space: nowrap;
  }
  .sync-pill.warn { background: #f1c27d; color: #3d2a0a; }

  h2 { font-size: 20px; margin: 20px 0 10px; }
  h3 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .muted { color: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin: 12px 0;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 48px; padding: 0 18px; border-radius: 12px;
    font-weight: 600; background: var(--green-soft); color: var(--green);
  }
  .btn.primary { background: var(--green); color: #fff; }
  .btn.danger { background: var(--red-soft); color: var(--red); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn.block { width: 100%; }
  .btn.big { min-height: 60px; font-size: 19px; }
  .btn:disabled { opacity: .4; cursor: default; }

  label.field { display: block; margin: 10px 0; }
  label.field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=url], input[type=password], select {
    width: 100%; min-height: 48px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: #fff;
  }

  /* Sell grid */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
  .prod {
    position: relative; background: var(--card); border: 2px solid var(--line);
    border-radius: var(--radius); padding: 14px 10px; min-height: 112px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    text-align: center; transition: transform .06s;
  }
  .prod:active { transform: scale(.97); }
  .prod .emo { font-size: 34px; line-height: 1; }
  .prod .nm { font-weight: 600; font-size: 15px; }
  .prod .pr { color: var(--green); font-weight: 700; }
  .prod.in-cart { border-color: var(--green); background: var(--green-soft); }
  .prod .badge {
    position: absolute; top: 8px; right: 8px; min-width: 28px; height: 28px; padding: 0 6px;
    border-radius: 99px; background: var(--green); color: #fff; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }

  .cart-line { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .cart-line:last-child { border-bottom: 0; }
  .cart-line .nm { flex: 1; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qty button { width: 38px; height: 38px; border-radius: 10px; background: var(--green-soft); color: var(--green); font-size: 20px; font-weight: 700; }
  .qty b { min-width: 24px; text-align: center; }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; font-weight: 800; margin-top: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 44px; padding: 0 16px; border-radius: 99px; border: 2px solid var(--line);
    background: #fff; font-weight: 600;
  }
  .chip.on { border-color: var(--green); background: var(--green); color: #fff; }
  .change-due { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--amber-soft); color: #6a3d06; font-weight: 700; font-size: 18px; text-align: center; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat.hero { grid-column: 1 / -1; background: var(--green); color: #fff; border: 0; }
  .stat.hero b { font-size: 36px; }
  .stat.hero span { color: rgba(255,255,255,.85); }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; font-size: 15px; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  td.r, th.r { text-align: right; }

  .sale { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sale:last-child { border-bottom: 0; }
  .sale .body { flex: 1; min-width: 0; }
  .sale .amt { font-weight: 700; white-space: nowrap; }
  .sale.void .body, .sale.void .amt { text-decoration: line-through; opacity: .5; }
  .sale small { color: var(--muted); }
  .linkish { color: var(--red); font-size: 13px; font-weight: 600; padding: 4px 0; }

  .session-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .session-row:last-child { border-bottom: 0; }
  .session-row .body { flex: 1; }

  .prod-edit { display: grid; grid-template-columns: 56px 1fr 90px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .prod-edit input { min-height: 44px; }
  .prod-edit .row2 { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; font-size: 14px; }
  .prod-edit .row2 label { display: flex; gap: 6px; align-items: center; }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: #fff; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); padding: 0; }
  nav.tabs button { min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
  nav.tabs button .ic { font-size: 22px; line-height: 1; }
  nav.tabs button.on { color: var(--green); }

  .toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600;
    z-index: 20; max-width: calc(100% - 32px); text-align: center;
    animation: pop .2s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 10px); } }
  .modal-bg {
    position: fixed; inset: 0; z-index: 30; background: rgba(20, 28, 20, .45);
    display: flex; align-items: flex-end; justify-content: center; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  @media (min-width: 560px) { .modal-bg { align-items: center; } }
  .modal { background: var(--card); border-radius: 20px; padding: 20px; width: 100%; max-width: 440px; animation: rise .15s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .modal p { margin: 0 0 6px; white-space: pre-line; font-size: 17px; }
  .modal .row { margin-top: 16px; }
  .empty { text-align: center; padding: 28px 10px; color: var(--muted); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>🌾 Aansh Creations <small id="hdrSub">Point of Sale</small></h1>
    <span id="syncPill" class="sync-pill"></span>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs">
  <div class="wrap">
    <button data-tab="sell"><span class="ic">🛒</span>Sell</button>
    <button data-tab="today"><span class="ic">📊</span>Today</button>
    <button data-tab="history"><span class="ic">📅</span>History</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Settings</button>
  </div>
</nav>

<script>
(() => {
  'use strict';

  // ---------- storage ----------
  const KEY = 'aansh-pos-v1';
  const DEFAULT_PRODUCTS = [
    // Fixed ids so every phone shares the same starting products.
    { id: 'p-magnet',   name: 'Fridge Magnet',    price: 300, emoji: '🧲' },
    { id: 'p-bookmark', name: 'Bookmark',         price: 50,  emoji: '🔖' },
    { id: 'p-origami',  name: 'Origami',          price: 25,  emoji: '🦢' },
    { id: 'p-trail-s',  name: 'Small Trail Mix',  price: 300, emoji: '🥜' },
    { id: 'p-trail-l',  name: 'Large Trail Mix',  price: 500, emoji: '🛍️' },
  ];
  const DEFAULT_PAYMENTS = ['Cash', 'Venmo', 'Zelle', 'Card'];

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function freshState() {
    return {
      proto: 2,
      products: DEFAULT_PRODUCTS.map(p => ({ active: true, ...p })),   // + deleted
      cfg: { id: 'payments', list: DEFAULT_PAYMENTS.slice() },
      sessions: [],   // {id, market, openedAt, closedAt, startCash, deleted}
      sales: [],      // {id, sessionId, at, items:[{productId,name,price,qty}], total, payment, cashGiven, voided}
      // Every record also has u (edited-at ms), v (local version), sv (version last sent to the server).
      pulledAt: 0,    // server time of the last download
      syncUrl: '',
      token: '',      // device key from the server; preferred over password
      password: '',   // only kept if the server is too old to issue keys
      lastSyncAt: null,
      lastSyncError: null,
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        const st = Object.assign(freshState(), saved);
        return saved.proto === 2 ? st : migrate(st);
      }
    } catch (e) { console.warn('load failed', e); }
    return freshState();
  }
  // Phones from before two-way sync: give default products the shared ids and re-send everything.
  function migrate(st) {
    for (const d of DEFAULT_PRODUCTS) {
      const p = st.products.find(p => p.name === d.name);
      if (p) p.id = d.id;
    }
    st.cfg = { id: 'payments', list: st.payments || DEFAULT_PAYMENTS.slice() };
    delete st.payments; delete st.currentSessionId;
    for (const r of [...st.sessions, ...st.sales, ...st.products, st.cfg]) { r.v = r.v || 1; r.sv = 0; r.u = r.u || 1; }
    st.proto = 2;
    return st;
  }
  let S = load();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('⚠️ Could not save on this phone!'); }
  }

  // Version counters so sync knows what changed: v = local version, sv = last synced version.
  const touch = rec => { rec.v = (rec.v || 0) + 1; rec.u = Math.max(Date.now(), (rec.u || 0) + 1); };
  const dirty = rec => (rec.v || 0) !== (rec.sv || 0);

  // Store server (Apps Script web app). Encoded only to keep it out of plain sight;
  // the server itself rejects anything without the password.
  S.syncUrl = atob('aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3QVFIZ3JMMlNnVVlNMGlvWURkYXA3dDN4WUg2SVRSZXJBUmR0U0lrdGt4WHdhY0NJaWVFNzBGLU42TVhhZ2FYX0UvZXhlYw==');

  // ---------- helpers ----------
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = c => (c < 0 ? '-' : '') + '$' + (Math.abs(c) / 100).toFixed(2).replace(/\.00$/, '');
  const money2 = c => (c < 0 ? '-' : '') + '$' + (Math.abs(c) / 100).toFixed(2);
  const toCents = v => Math.round(parseFloat(String(v).replace(/[^0-9.]/g, '')) * 100) || 0;
  const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  const fmtTime = iso => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const fmtDur = (a, b) => {
    const m = Math.round((new Date(b) - new Date(a)) / 60000);
    return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`;
  };

  let toastTimer;
  function toast(msg) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), 2200);
  }

  const byTime = k => (a, b) => (a[k] < b[k] ? -1 : a[k] > b[k] ? 1 : 0);
  const liveSessions = () => S.sessions.filter(s => !s.deleted).sort(byTime('openedAt'));
  // The open market day is shared: whichever phone opened it, everyone sells into it.
  // In-page dialogs. Built-in confirm()/prompt() are blocked silently by some
  // embedded browsers, which made buttons like "Close store" do nothing.
  function dialog({ message, fields = [], ok = 'OK', danger = false }) {
    return new Promise(resolve => {
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
        <p>${esc(message)}</p>
        ${fields.map((f, i) => `<label class="field"><span>${esc(f.label)}</span>
          <input data-i="${i}" type="${f.type || 'text'}" ${f.inputmode ? `inputmode="${f.inputmode}"` : ''} placeholder="${esc(f.placeholder || '')}" value="${esc(f.value || '')}"></label>`).join('')}
        <div class="row">
          <button class="btn ghost" data-act="cancel">Cancel</button>
          <button class="btn ${danger ? 'danger' : 'primary'}" data-act="ok">${esc(ok)}</button>
        </div></div>`;
      const done = val => { bg.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
      const submit = () => done(fields.length ? [...bg.querySelectorAll('input')].map(i => i.value) : true);
      const onKey = e => { if (e.key === 'Escape') done(null); if (e.key === 'Enter') submit(); };
      bg.onclick = e => { if (e.target === bg) done(null); };
      bg.querySelector('[data-act=cancel]').onclick = () => done(null);
      bg.querySelector('[data-act=ok]').onclick = submit;
      document.addEventListener('keydown', onKey);
      document.body.appendChild(bg);
      const first = bg.querySelector('input');
      if (first) first.focus();
    });
  }
  const ask = (message, opts = {}) => dialog({ message, ...opts }).then(Boolean);

  const currentSession = () => liveSessions().filter(s => !s.closedAt).pop() || null;
  const salesFor = sid => S.sales.filter(x => x.sessionId === sid).sort(byTime('at'));
  const liveSales = () => { const ok = new Set(liveSessions().map(s => s.id)); return S.sales.filter(x => ok.has(x.sessionId)); };
  const liveProducts = () => S.products.filter(p => !p.deleted);

  function summarize(sales) {
    const live = sales.filter(x => !x.voided);
    const byProduct = {}, byPayment = {};
    let revenue = 0, items = 0;
    for (const s of live) {
      revenue += s.total;
      byPayment[s.payment] = (byPayment[s.payment] || 0) + s.total;
      for (const it of s.items) {
        items += it.qty;
        const k = it.name;
        byProduct[k] = byProduct[k] || { qty: 0, total: 0 };
        byProduct[k].qty += it.qty;
        byProduct[k].total += it.qty * it.price;
      }
    }
    return { revenue, items, count: live.length, byProduct, byPayment };
  }

  // ---------- UI state ----------
  let tab = 'sell';
  let cart = {};          // productId -> qty  (custom lines use key "custom:<id>")
  let customLines = {};   // key -> {name, price}
  let payment = null;
  let cashGiven = null;
  let viewingSessionId = null;

  function cartLines() {
    return Object.entries(cart).filter(([, q]) => q > 0).map(([k, qty]) => {
      if (k.startsWith('custom:')) return { productId: k, ...customLines[k], qty };
      const p = S.products.find(p => p.id === k);
      return p ? { productId: p.id, name: p.name, price: p.price, qty } : null;
    }).filter(Boolean);
  }
  const cartTotal = () => cartLines().reduce((a, l) => a + l.price * l.qty, 0);
  function clearCart() { cart = {}; customLines = {}; payment = null; cashGiven = null; }

  // ---------- render ----------
  const view = $('#view');

  const unlocked = () => !!(S.syncUrl && (S.token || S.password));
  const auth = () => S.token ? { token: S.token } : { password: S.password };
  const post = async body => (await fetch(S.syncUrl, {
    method: 'POST', body: JSON.stringify(body),
    // text/plain avoids a CORS preflight, which Apps Script can't answer.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
  })).json();
  function signIn(out, pw) {
    if (out.token) { S.token = out.token; S.password = ''; }
    else S.password = pw;
    save();
  }
  function signOut() { S.token = ''; S.password = ''; save(); }

  function render() {
    document.querySelector('nav.tabs').classList.toggle('hidden', !unlocked());
    if (!unlocked()) { $('#hdrSub').textContent = 'Private'; $('#syncPill').className = 'hidden'; return renderLock(); }
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    const cs = currentSession();
    $('#hdrSub').textContent = cs ? `Open · ${cs.market}` : 'Store closed';
    renderSyncPill();
    ({ sell: renderSell, today: renderToday, history: renderHistory, settings: renderSettings })[tab]();
  }

  function renderSyncPill() {
    const pill = $('#syncPill');
    if (!unlocked()) return;
    const pending = allRecords().filter(dirty).length;
    if (pending) { pill.textContent = `⏳ ${pending} to sync`; pill.className = 'sync-pill warn'; }
    else { pill.textContent = '☁️ Synced'; pill.className = 'sync-pill'; }
  }

  function renderLock() {
    view.innerHTML = `
      <div class="card" style="margin-top:28px;text-align:center">
        <div style="font-size:48px">🔒</div>
        <h2 style="margin-top:6px">This store is private</h2>
        <p class="muted">Enter the store password to start selling.</p>
        <label class="field" style="text-align:left"><span>Password</span>
          <input id="lockPw" type="password" autocomplete="current-password"></label>
        <button class="btn primary block big" id="lockBtn">Unlock</button>
        <p id="lockMsg" class="muted" style="min-height:1.4em"></p>
      </div>`;
    const go = async () => {
      const url = S.syncUrl;
      const pw = $('#lockPw').value;
      const msg = $('#lockMsg');
      if (!pw) return;
      $('#lockBtn').disabled = true; msg.textContent = 'Checking…';
      try {
        const out = await post({ action: 'login', password: pw });
        if (out.ok) { signIn(out, pw); toast('🔓 Welcome, Aansh!'); render(); sync(); return; }
        msg.textContent = out.error === 'locked' ? 'Too many wrong tries. Wait 15 minutes.' : 'Wrong password.';
      } catch (e) {
        msg.textContent = 'Could not reach the store. Check your internet.';
      }
      $('#lockBtn').disabled = false;
    };
    $('#lockBtn').onclick = go;
    $('#lockPw').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  function renderOpenStore() {
    const lastMarket = liveSessions().length ? liveSessions().pop().market : '';
    view.innerHTML = `
      <div class="card" style="margin-top:20px;text-align:center">
        <div style="font-size:48px">🏪</div>
        <h2 style="margin-top:6px">Open the store</h2>
        <p class="muted">Start a new market day to begin selling.</p>
        <label class="field" style="text-align:left"><span>Market / location</span>
          <input id="mkt" type="text" placeholder="e.g. Saturday Farmers Market" value="${esc(lastMarket)}"></label>
        <label class="field" style="text-align:left"><span>Starting cash in the box (optional)</span>
          <input id="startCash" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></label>
        <button class="btn primary block big" id="openBtn">Open store 🎉</button>
      </div>`;
    $('#openBtn').onclick = async () => {
      const market = $('#mkt').value.trim() || 'Farmers Market';
      const startCash = toCents($('#startCash').value);
      // Another phone may have opened the store already; join it instead of starting a second day.
      $('#openBtn').disabled = true;
      await sync();
      if (currentSession()) { toast('Joined the store opened on another phone 👋'); render(); return; }
      const s = { id: uid(), market, openedAt: new Date().toISOString(), closedAt: null, startCash };
      touch(s);
      S.sessions.push(s);
      save(); sync();
      toast('Store is open — good luck! 🍀');
      render();
    };
  }

  function completeSale() {
    const cs = currentSession();

  // ---------- export ----------
  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function exportCsv() {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['Date', 'Time', 'Market', 'Sale ID', 'Item', 'Qty', 'Unit Price', 'Line Total', 'Payment', 'Removed']];
    for (const s of liveSales().sort(byTime('at'))) {
      const sess = S.sessions.find(x => x.id === s.sessionId);
      for (const i of s.items) {
        rows.push([new Date(s.at).toLocaleDateString(), fmtTime(s.at), sess ? sess.market : '', s.id, i.name, i.qty,
          (i.price / 100).toFixed(2), (i.price * i.qty / 100).toFixed(2), s.payment, s.voided ? 'yes' : '']);
      }
    }
    download(`aansh-sales-${new Date().toISOString().slice(0, 10)}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
  }

  // ---------- Google Sheet sync ----------
  const allRecords = () => [...S.sessions, ...S.sales, ...S.products, S.cfg];
  const strip = ({ v, sv, ...rest }) => rest;

  // Apply records downloaded from the server. Newest edit wins. Records are
  // updated in place so screens holding a reference keep seeing fresh data.
  function merge(records) {
    let changed = false;
    for (const { type, ...rec } of records) {
      if (type === 'config') {
        if (rec.id === 'payments' && (rec.u || 0) > (S.cfg.u || 0) && !dirty(S.cfg)) { Object.assign(S.cfg, rec, { v: 1, sv: 1 }); changed = true; }
        continue;
      }
      const list = { session: S.sessions, sale: S.sales, product: S.products }[type];
      if (!list || !rec.id) continue;
      const local = list.find(x => x.id === rec.id);
      if (local && (local.u || 0) >= (rec.u || 0)) continue;
      if (local) {
        Object.keys(local).forEach(k => delete local[k]);
        Object.assign(local, rec, { v: 1, sv: 1 });
      } else list.push({ ...rec, v: 1, sv: 1 });
      changed = true;
    }
    return changed;
  }

  let syncing = false;
  async function sync(manual = false) {
    if (!unlocked() || syncing) return;
    if (!navigator.onLine) { if (manual) toast('No internet — will sync later'); return; }

    syncing = true;
    const pending = [['session', S.sessions], ['sale', S.sales], ['product', S.products], ['config', [S.cfg]]]
      .flatMap(([type, list]) => list.filter(dirty).map(r => ({ type, r })));
    const sentV = new Map(pending.map(({ r }) => [r, r.v]));
    const sessions = pending.filter(p => p.type === 'session').map(p => p.r);
    const sales = pending.filter(p => p.type === 'sale').map(p => p.r);
    let changed = false;
    // Old servers read `sessions`/`sales`; new ones read `records` and reply with other phones' changes.
    const payload = {
      action: 'sync',
      since: S.pulledAt || 0,
      records: pending.map(({ type, r }) => ({ type, ...strip(r) })),
      sessions: sessions.map(s => {
        const sm = summarize(salesFor(s.id));
        return { id: s.id, market: s.market, openedAt: s.openedAt, closedAt: s.closedAt, startCash: (s.startCash || 0) / 100,
          sales: sm.count, items: sm.items, revenue: sm.revenue / 100,
          byPayment: Object.fromEntries(Object.entries(sm.byPayment).map(([k, v]) => [k, v / 100])) };
      }),
      sales: sales.map(s => {
        const sess = S.sessions.find(x => x.id === s.sessionId);
        return { id: s.id, sessionId: s.sessionId, market: sess ? sess.market : '', at: s.at, payment: s.payment, voided: !!s.voided,
          total: s.total / 100, items: s.items.map(i => ({ name: i.name, qty: i.qty, price: i.price / 100 })) };
      }),
    };
    try {
      await upgradeToKey();
      const out = await post({ ...auth(), ...payload });
      if (out.error === 'unauthorized') { signOut(); toast('🔒 Please unlock again'); return; }
      if (!out.ok) throw new Error(out.error || 'Sheet said no');
      sentV.forEach((v, r) => { r.sv = v; });
      if (Array.isArray(out.records)) { changed = merge(out.records); S.pulledAt = out.now; }
      S.lastSyncAt = new Date().toISOString();
      S.lastSyncError = null;
      if (manual) toast('☁️ Synced');
    } catch (e) {
      S.lastSyncError = String(e.message || e);
      if (manual) toast('⚠️ Sync failed — saved on phone, will retry');
    } finally {
      syncing = false;
      save();
      renderSyncPill();
      // Don't redraw under someone typing in Settings.
      const typing = view.contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName);
      if (!unlocked() || ((changed || tab === 'settings') && !typing)) render();
    }
  }
  // Phones logged in before device keys existed: swap the saved password for a key.
  let triedUpgrade = false;
  async function upgradeToKey() {
    if (S.token || !S.password || triedUpgrade) return;
    triedUpgrade = true;
    try {
      const out = await post({ action: 'login', password: S.password });
      if (out.ok && out.token) signIn(out);
    } catch (e) { /* offline; try again next page load */ }
  }

  window.addEventListener('online', () => sync());
  setInterval(() => { if (!document.hidden) sync(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });

  // ---------- boot ----------
  document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
    tab = b.dataset.tab; viewingSessionId = null; render(); window.scrollTo(0, 0);
  });
  $('#syncPill').onclick = () => sync(true);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  render();
  upgradeToKey().then(() => sync());
})();
</script>
</body>
</html>
